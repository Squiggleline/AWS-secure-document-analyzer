AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Secure Document Analyzer - SAM template for API Gateway and Lambda'

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12

Parameters:
  BucketName:
    Type: String
    Default: 'ai-security-uploads-2026'
    Description: 'Name of the S3 bucket for document storage'

Resources:
  # Lambda Function
  DocumentAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda_function.lambda_handler
      FunctionName: 'secure-document-analyzer'
      Environment:
        Variables:
          BUCKET_NAME: !Ref BucketName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
              Resource: !Sub 'arn:aws:s3:::${BucketName}/*'
            - Effect: Allow
              Action:
                - 'textract:DetectDocumentText'
              Resource: '*'
            - Effect: Allow
              Action:
                - 'kms:Decrypt'
                - 'kms:Encrypt'
                - 'kms:GenerateDataKey'
              Resource: '*'
            - Effect: Allow
              Action:
                - 'logs:CreateLogGroup'
                - 'logs:CreateLogStream'
                - 'logs:PutLogEvents'
              Resource: '*'
      Events:
        DocumentUpload:
          Type: Api
          Properties:
            Path: /document
            Method: post
            RestApiId: !Ref DocumentApi

  # API Gateway
  DocumentApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: 'SecureDocumentAnalyzerAPI'
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'POST,OPTIONS'"

Outputs:
  ApiUrl:
    Description: 'URL of the API Gateway endpoint'
    Value: !Sub 'https://${DocumentApi}.execute-api.${AWS::Region}.amazonaws.com/prod/document'
  LambdaArn:
    Description: 'ARN of the Lambda function'
    Value: !GetAtt DocumentAnalyzerFunction.Arn