AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  # Secure Document Analyzer - AWS SAM Template
  # 
  # This template provisions:
  # - Lambda function for document processing
  # - API Gateway for REST endpoints
  # - IAM roles with least-privilege permissions
  # - Optional: S3 bucket with KMS encryption
  #
  # Architecture: User Upload -> API Gateway -> Lambda -> S3 -> Textract -> Return text

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12

Parameters:
  # ============================================================================
  # S3 Bucket Configuration
  # ============================================================================
  # Option 1: Use an existing bucket (set CreateBucket=false)
  # Option 2: Create a new bucket with KMS encryption (set CreateBucket=true)
  CreateBucket:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: 'Whether to create a new S3 bucket or use an existing one'
  
  DocumentBucketName:
    Type: String
    Default: 'ai-security-uploads-2026'
    Description: 'Name of the S3 bucket for document storage'
  
KmsKeyArn:
  Type: String
  Description: 'ARN of the KMS key used to encrypt the existing document bucket'
  
  LogLevel:
    Type: String
    Default: 'INFO'
    AllowedValues:
      - 'DEBUG'
      - 'INFO'
      - 'WARNING'
      - 'ERROR'
    Description: 'Log level for Lambda function'

  MaxFileSizeBytes:
    Type: Number
    Default: '10485760'
    Description: 'Maximum upload file size in bytes (default: 10 MB)'

  CorsAllowedOrigin:
    Type: String
    Default: '*'
    Description: 'CORS allowed origin for API Gateway (use * for all origins, or specify a domain like https://example.com)'

Conditions:
  # Condition to check if we should create a new bucket
  ShouldCreateBucket: !Equals [!Ref CreateBucket, 'true']

Resources:
  # ============================================================================
  # S3 Bucket (Optional - for new deployments)
  # ============================================================================
  # Creates a new S3 bucket with KMS encryption if CreateBucket=true
  # If using an existing bucket, this resource is skipped
  DocumentBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBucket
    Properties:
      BucketName: !Ref DocumentBucketName
      # Enable server-side encryption with KMS
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !If [!Equals [!Ref KmsKeyId, ''], !Ref AWS::NoValue, !Ref KmsKeyId]
      # Block public access for security
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Enable versioning to protect against accidental overwrites/deletes.
      # The Lambda handler uses the client-supplied filename as the S3 key,
      # so re-uploading the same filename would silently overwrite the
      # previous object. Versioning preserves all versions for audit and
      # recovery.
      VersioningConfiguration:
        Status: Enabled
      # Lifecycle rule: transition noncurrent (older) versions to
      # Glacier after 90 days and expire them after 365 days to
      # control storage costs while retaining recent history.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - NoncurrentDays: 90
                StorageClass: GLACIER
            NoncurrentVersionExpiration:
              NoncurrentDays: 365

  # ============================================================================
  # Lambda Function - Document Processing
  # ============================================================================
  # This function handles:
  # 1. Receiving file uploads from API Gateway
  # 2. Storing documents in S3
  # 3. Extracting text using Amazon Textract
  # 4. Returning extracted text to the client
  DocumentAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      FunctionName: 'secure-document-analyzer'
      
      # Environment variables for configuration
      # All configuration is externalized for flexibility
      Environment:
        Variables:
          BUCKET_NAME: !Ref DocumentBucketName
          LOG_LEVEL: !Ref LogLevel
          MAX_FILE_SIZE_BYTES: !Ref MaxFileSizeBytes
          CORS_ALLOWED_ORIGIN: !Ref CorsAllowedOrigin
      
      # Least-privilege IAM policies
      # Each policy grants only the minimum required permissions
      Policies:
        # S3 Access - Only PutObject and GetObject on the specific document bucket.
        # S3CrudPolicy grants DeleteObject, PutObjectAcl, and other unnecessary
        # permissions, so we use an explicit statement instead.
        - Statement:
            - Effect: Allow
              Action:
                - 's3:PutObject'
                - 's3:GetObject'
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${DocumentBucketName}/*'

        # Textract - Only detect document text (not full analyze).
        # Textract does not support resource-level permissions, so '*' is
        # required here. This is the minimum Textract action needed.
        - Statement:
            - Effect: Allow
              Action:
                - 'textract:DetectDocumentText'
              Resource: '*'

        # KMS - Only Decrypt on the bucket's KMS key.
        # The Lambda reads objects from S3 (which are KMS-encrypted), so it
        # needs kms:Decrypt. Encrypt and GenerateDataKey are not needed
        # because the Lambda does not write KMS-encrypted data directly.
        - Statement:
            - Effect: Allow
              Action:
                - 'kms:Decrypt'
              Resource: !Ref KmsKeyArn
      
      # API Gateway event trigger
      # Creates a POST endpoint at /document
      Events:
        DocumentUpload:
          Type: Api
          Properties:
            Path: /document
            Method: post
            RestApiId: !Ref DocumentApi

  # ============================================================================
  # API Gateway - REST API Endpoint
  # ============================================================================
  # Provides a public endpoint for document uploads
  # CORS enabled for web client access
  DocumentApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: 'SecureDocumentAnalyzerAPI'
      StageName: prod
      
      # CORS configuration for web clients
      # AllowOrigin is configurable via the CorsAllowedOrigin parameter.
      # AllowHeaders includes 'filename' (used by the upload endpoint) and
      # all standard API Gateway headers.
      Cors:
        AllowOrigin: !Sub "'${CorsAllowedOrigin}'"
        AllowHeaders: "'Content-Type,filename,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'POST,OPTIONS'"
        AllowCredentials: "'true'"
        MaxAge: "'86400'"

Outputs:
  # ============================================================================
  # Stack Outputs
  # ============================================================================
  ApiUrl:
    Description: 'URL of the API Gateway endpoint for document uploads'
    Value: !Sub 'https://${DocumentApi}.execute-api.${AWS::Region}.amazonaws.com/prod/document'
  
  LambdaArn:
    Description: 'ARN of the Lambda function'
    Value: !GetAtt DocumentAnalyzerFunction.Arn
  
  DocumentBucket:
    Description: 'S3 bucket for document storage'
    Value: !If [ShouldCreateBucket, !Ref DocumentBucketName, !Ref DocumentBucketName]
