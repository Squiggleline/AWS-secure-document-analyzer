version = 0.1

[default]
[default.global]
[default.global.parameters]
stack_name = "secure-document-analyzer"

[default.build]
[default.build.parameters]
cached = true
parallel = true

[default.deploy]
[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"

# Template parameters (matching template.yaml Parameters section)
# These prevent interactive prompts during `sam deploy`.
# The S3 bucket (name and KMS encryption) is created entirely by the
# template - no bucket/KMS parameters exist. The bucket name and KMS key
# ARN are exposed as stack outputs (DocumentBucket, KmsKeyArn).
parameter_overrides = "LogLevel=INFO MaxFileSizeBytes=10485760 CorsAllowedOrigin=*"

[default.sync]
[default.sync.parameters]
watch = true

[default.local_start_api]
[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_invoke]
[default.local_invoke.parameters]
event = "events/document-upload-valid.json"