version = 0.1

[default]
[default.global]
[default.global.parameters]
stack_name = "secure-document-analyzer"

[default.build]
[default.build.parameters]
cached = true
parallel = true

[default.deploy]
[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"

# Template parameters (matching template.yaml Parameters section)
# These prevent interactive prompts during `sam deploy`.
# KmsKeyArn is required (the ARN of the KMS key that encrypts the bucket).
parameter_overrides = "CreateBucket=false DocumentBucketName=ai-security-uploads-2026 KmsKeyId= KmsKeyArn= LogLevel=INFO MaxFileSizeBytes=10485760 CorsAllowedOrigin=*"

[default.sync]
[default.sync.parameters]
watch = true

[default.local_start_api]
[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_invoke]
[default.local_invoke.parameters]
event = "events/document-upload-valid.json"